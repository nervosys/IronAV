# cargo-deny policy: `cargo deny check` (advisories, bans, licenses, sources).

[graph]
all-features = true

[advisories]
# unmaintained and unsound crates are reported; the ones below are reached only through the GUI front end, never on a path that reads media or the network
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser (unmaintained), used by winit's Wayland decorations for bundled fonts" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant (unmaintained), accessibility over D-Bus in eframe on Linux" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names (unmaintained), accessibility over D-Bus in eframe on Linux" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive (unmaintained), accessibility over D-Bus in eframe on Linux" },
]

[licenses]
# every licence is compatible with IronAV's AGPL-3.0-or-later
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LGPL-2.1-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
