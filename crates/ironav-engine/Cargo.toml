[package]
name = "ironav-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Engine for IronAV: job specs, planning, threaded execution and the agent tool registry."
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
# the reference media is for the tests in the repository, not for users of the crate
exclude = ["tests/data"]
keywords = ["video", "audio", "transcode", "streaming", "multimedia"]
categories = ["multimedia::encoding", "multimedia::video", "multimedia::audio"]


[lints]
workspace = true

[features]
# FIPS mode in the live sources (see ironav-live's `fips` feature)
fips = ["ironav-live/fips"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ironav-core.workspace = true
ironav-hwaccel.workspace = true
ironav-codec.workspace = true
ironav-formats.workspace = true
ironav-ontology.workspace = true
ironav-analyze.workspace = true
ironav-live.workspace = true
ironav-player.workspace = true

[target.'cfg(windows)'.dependencies]
# sidecar resource limits: a job object per child (the same windows crate and version as ironav-live)
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
# sidecar resource limits: setrlimit before exec (the same libc as ironav-live)
libc = "0.2"
