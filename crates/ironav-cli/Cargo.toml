[package]
name = "ironav-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line front end for IronAV: every command prints one JSON envelope on stdout and exits non-zero on error."
homepage.workspace = true
authors.workspace = true
rust-version = "1.95" # egui
readme = "../../README.md"
keywords = ["video", "audio", "cli", "transcode", "multimedia"]
categories = ["command-line-utilities", "multimedia::encoding"]


[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ironav-core.workspace = true
ironav-hwaccel.workspace = true
ironav-engine.workspace = true
ironav-live.workspace = true
ironav-webui.workspace = true
ironav-gui = { workspace = true, optional = true }
ironav-ontology.workspace = true
ironav-player.workspace = true
# no layout-cache: its lru dependency is flagged unsound (RUSTSEC-2026-0002, RUSTSEC-2026-0253)
ratatui = { version = "0.30", default-features = false, features = ["std", "crossterm", "all-widgets", "underline-color"] }

[features]
default = ["native-gui", "audio"]
# Sound output through the operating system (needs the ALSA development files on Linux).
# Without it `ironav play` still works against a silent clock.
audio = ["ironav-player/audio"]
# Native desktop GUI (egui). Disable for lean agent/server builds: --no-default-features
native-gui = ["dep:ironav-gui"]
# FIPS mode: approved TLS algorithms only, plaintext transports and MD5 Digest refused (see ironav-live)
fips = ["ironav-engine/fips", "ironav-live/fips"]

[[bin]]
name = "ironav"
path = "src/main.rs"

# The windows live in their own program so `ironav` starts in milliseconds.
[[bin]]
name = "ironav-gui"
path = "src/gui_main.rs"
doc = false
required-features = ["native-gui"]
