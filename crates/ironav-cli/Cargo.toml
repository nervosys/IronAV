[package]
name = "ironav-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ironav-core.workspace = true
ironav-hwaccel.workspace = true
ironav-engine.workspace = true
ironav-webui.workspace = true
ironav-gui = { workspace = true, optional = true }
ironav-ontology.workspace = true

[features]
default = ["native-gui"]
# Native desktop GUI (egui). Disable for lean agent/server builds: --no-default-features
native-gui = ["dep:ironav-gui"]

[[bin]]
name = "ironav"
path = "src/main.rs"
