[package]
name = "ironav-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types for IronAV: errors, rationals, media descriptions and the traits that codecs, containers and filters implement."
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["video", "audio", "multimedia", "codec", "media"]
categories = ["multimedia", "multimedia::encoding"]


[lints]
workspace = true

# `serde` (the default) gives the core types their Serialize and Deserialize impls and the
# `From<serde_json::Error>` conversion. Without it the crate has no dependencies.
[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
