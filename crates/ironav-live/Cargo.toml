[package]
name = "ironav-live"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Live input for IronAV: byte sources (growing files, pipes, TCP, UDP, RTSP) read as they arrive."
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["streaming", "video", "audio", "rtsp", "hls"]
categories = ["multimedia::video", "multimedia::audio", "network-programming"]


[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ironav-core.workspace = true
ironav-formats.workspace = true
# TLS 1.3 for https:// and rtsps://, with IronPKI validating certificates
ironsocketlayer = "0.7.2"
# the operating system's entropy through a DRBG, for Digest cnonces and WS-Security nonces
ic-drbg = { version = "0.3.2", features = ["std"] }

[target.'cfg(windows)'.dependencies]
# cameras and microphones through Media Foundation
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }

[target.'cfg(target_os = "linux")'.dependencies]
# cameras through Video4Linux2's ioctls
libc = "0.2"

[dev-dependencies]
# the TLS test issues its own certificates (ic-drbg is a dependency already)
