[package]
name = "ironav-live"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Live input for IronAV: byte sources (growing files, pipes, TCP, UDP, RTSP) read as they arrive."
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["streaming", "video", "audio", "rtsp", "hls"]
categories = ["multimedia::video", "multimedia::audio", "network-programming"]


[lints]
workspace = true

[features]
# FIPS mode: IronSocketLayer's FIPS 140-3 TLS profile narrowed to approved algorithms, plaintext
# transports refused and MD5 Digest refused (see src/fips.rs). IronCrypto is not CMVP-validated.
fips = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
ironav-core.workspace = true
ironav-formats.workspace = true
# TLS 1.3 for https:// and rtsps://, with IronPKI validating certificates
ironsocketlayer = "0.7.2"
# the operating system's entropy through a DRBG, for Digest cnonces and WS-Security nonces
ic-drbg = { version = "0.3.2", features = ["std"] }
# AES and the RFC 3394 key wrap for SRT's encrypted streams (the crates IronSocketLayer uses)
ic-cipher = "0.3.2"
ic-core = "0.3.2"

[target.'cfg(windows)'.dependencies]
# cameras and microphones through Media Foundation
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }

[target.'cfg(target_os = "linux")'.dependencies]
# cameras through Video4Linux2's ioctls
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# cameras and microphones through AVFoundation
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSValue"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureAudioDataOutput", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureVideoDataOutput", "AVMediaFormat", "block2", "dispatch2", "objc2-core-media"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-audio-types", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
block2 = "0.6"

[dev-dependencies]
# the TLS test issues its own certificates (ic-drbg is a dependency already)
