[workspace]
resolver = "2"
members = [
    "crates/ironav-core",
    "crates/ironav-hwaccel",
    "crates/ironav-codec",
    "crates/ironav-formats",
    "crates/ironav-ontology",
    "crates/ironav-analyze",
    "crates/ironav-live",
    "crates/ironav-player",
    "crates/ironav-engine",
    "crates/ironav-webui",
    "crates/ironav-gui",
    "crates/ironav-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.88"
repository = "https://github.com/nervosys/IronAV"
homepage = "https://github.com/nervosys/IronAV"
authors = ["nervosys"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ironav-core = { path = "crates/ironav-core", version = "0.1.0" }
ironav-hwaccel = { path = "crates/ironav-hwaccel", version = "0.1.0" }
ironav-codec = { path = "crates/ironav-codec", version = "0.1.0" }
ironav-formats = { path = "crates/ironav-formats", version = "0.1.0" }
ironav-ontology = { path = "crates/ironav-ontology", version = "0.1.0" }
ironav-analyze = { path = "crates/ironav-analyze", version = "0.1.0" }
ironav-live = { path = "crates/ironav-live", version = "0.1.0" }
ironav-player = { path = "crates/ironav-player", version = "0.1.0", default-features = false }
ironav-engine = { path = "crates/ironav-engine", version = "0.1.0" }
ironav-webui = { path = "crates/ironav-webui", version = "0.1.0" }
ironav-gui = { path = "crates/ironav-gui", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
