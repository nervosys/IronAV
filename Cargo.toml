[workspace]
resolver = "2"
members = [
    "crates/ironav-core",
    "crates/ironav-hwaccel",
    "crates/ironav-codec",
    "crates/ironav-formats",
    "crates/ironav-ontology",
    "crates/ironav-analyze",
    "crates/ironav-live",
    "crates/ironav-player",
    "crates/ironav-engine",
    "crates/ironav-webui",
    "crates/ironav-gui",
    "crates/ironav-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.80"
repository = "https://github.com/nervosys/IronAV"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ironav-core = { path = "crates/ironav-core" }
ironav-hwaccel = { path = "crates/ironav-hwaccel" }
ironav-codec = { path = "crates/ironav-codec" }
ironav-formats = { path = "crates/ironav-formats" }
ironav-ontology = { path = "crates/ironav-ontology" }
ironav-analyze = { path = "crates/ironav-analyze" }
ironav-live = { path = "crates/ironav-live" }
ironav-player = { path = "crates/ironav-player", default-features = false }
ironav-engine = { path = "crates/ironav-engine" }
ironav-webui = { path = "crates/ironav-webui" }
ironav-gui = { path = "crates/ironav-gui" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
