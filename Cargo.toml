[workspace]
resolver = "2"
members = [
    "crates/ironav-core",
    "crates/ironav-hwaccel",
    "crates/ironav-codec",
    "crates/ironav-formats",
    "crates/ironav-ontology",
    "crates/ironav-analyze",
    "crates/ironav-live",
    "crates/ironav-player",
    "crates/ironav-engine",
    "crates/ironav-webui",
    "crates/ironav-gui",
    "crates/ironav-cli",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.88"
repository = "https://github.com/nervosys/IronAV"
homepage = "https://github.com/nervosys/IronAV"
authors = ["nervosys"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ironav-core = { path = "crates/ironav-core", version = "0.1.2" }
ironav-hwaccel = { path = "crates/ironav-hwaccel", version = "0.1.2" }
ironav-codec = { path = "crates/ironav-codec", version = "0.1.2" }
ironav-formats = { path = "crates/ironav-formats", version = "0.1.2" }
ironav-ontology = { path = "crates/ironav-ontology", version = "0.1.2" }
ironav-analyze = { path = "crates/ironav-analyze", version = "0.1.2" }
ironav-live = { path = "crates/ironav-live", version = "0.1.2" }
ironav-player = { path = "crates/ironav-player", version = "0.1.2", default-features = false }
ironav-engine = { path = "crates/ironav-engine", version = "0.1.2" }
ironav-webui = { path = "crates/ironav-webui", version = "0.1.2" }
ironav-gui = { path = "crates/ironav-gui", version = "0.1.2" }

# Codec code follows its specifications: tables keep their published digits, loops index several
# arrays at once, and the decoding functions take what the syntax hands them.
[workspace.lints.clippy]
approx_constant = "allow"
excessive_precision = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
# Unwinding, not abort: the long-lived front ends (mcp, web UI, live sessions) catch a panic at the
# tool boundary and report it as an `internal` error instead of dying with every other session.
